[pytest]
# Pytest configuration for GoodWillShoppingSearch

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output and reporting options
addopts =
    --verbose
    --strict-markers
    --tb=short
    --cov=GoodWillShoppingSearch
    --cov-report=term-missing
    --cov-report=html
    --cov-fail-under=95

# Markers for categorizing tests
markers =
    unit: Unit tests for individual components
    integration: Integration tests with multiple components
    slow: Tests that take longer to run
    network: Tests requiring network access (currently all mocked)

# Coverage options
[coverage:run]
source = GoodWillShoppingSearch
omit =
    */tests/*
    */venv/*
    */__pycache__/*
    */site-packages/*

[coverage:report]
precision = 2
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
